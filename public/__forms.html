<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Netlify Forms detects form definitions in static HTML at deploy time.
      The React contact form at /contact posts here. Field names must match
      the inputs in src/components/ContactForm.tsx exactly.
      This page is never linked and is excluded from the sitemap and robots.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
    </form>
  </body>
</html>
